name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # macOS builds are unsigned unless you add a Developer ID certificate.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('package.json version ' + version + ' does not match tag ' + tag);
              process.exit(1);
            }
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm run build

      # Build only. A single publish job creates the release afterwards, so the
      # platforms can never race and split the update manifests across releases.
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Cubelight $VERSION" --generate-notes --latest
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json tagName,url,assets --jq '.tagName + " " + .url'
